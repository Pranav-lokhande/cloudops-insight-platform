apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudops
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudops-backend}
  template:
    metadata:
      labels: {app: cloudops-backend}
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_REGISTRY/backend:REPLACE_WITH_TAG
          ports: [{containerPort: 5000}]
          envFrom:
            - configMapRef: {name: cloudops-config}
            - secretRef: {name: cloudops-db-secret}
          readinessProbe:
            httpGet: {path: /api/health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudops
spec:
  selector: {app: cloudops-backend}
  ports: [{port: 5000, targetPort: 5000}]
