apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudops
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudops-frontend}
  template:
    metadata:
      labels: {app: cloudops-frontend}
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_REGISTRY/frontend:REPLACE_WITH_TAG
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudops
spec:
  selector: {app: cloudops-frontend}
  ports: [{port: 80, targetPort: 80}]
