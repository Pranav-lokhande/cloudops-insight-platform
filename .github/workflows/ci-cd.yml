
name: CloudOps Insight Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f compose.yaml config -q

      - name: Build backend image
        run: docker build -t cloudops-backend:test ./backend

      - name: Build frontend image
        run: docker build -t cloudops-frontend:test ./frontend

  deploy:
    name: Deploy to EC2
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            'cd ~/cloudops-insight-platform && git pull --ff-only origin main && docker compose up -d --build && docker compose ps'

      - name: Verify application health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          for attempt in $(seq 1 12); do
            if ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
              'curl -fsS http://localhost/api/health'; then
              exit 0
            fi
            sleep 5
          done
          echo "Application health check failed"
          exit 1
