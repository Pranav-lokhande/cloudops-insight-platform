apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-insight
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/REPLACE_ME.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
